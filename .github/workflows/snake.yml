# .github/workflows/snake.yml
# Generates the GitHub contribution snake SVGs and pushes them to the "output" branch.
# No extra secret required — uses the built-in GITHUB_TOKEN.

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 6 * * *"    # daily at 06:00 UTC
  workflow_dispatch:         # manual trigger from Actions tab
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate light + dark snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Yashasyadav
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
